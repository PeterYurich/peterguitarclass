<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book £9 Strategy Session — Peter's Guitar Class</title>
    <meta name="description" content="Book your £9 Strategy Session with Peter's Guitar Class. Choose a convenient time from the calendar below.">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon.png?v=2">
    <link rel="icon" href="favicon.ico?v=2" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Cormorant Garamond', 'serif'],
                    },
                    colors: {
                        wood: {
                            950: '#120C08',
                            900: '#1C130D',
                            850: '#241810',
                            800: '#2E1F15',
                            700: '#463020',
                            200: '#E8DDD1',
                            100: '#F4EDE4',
                            50:  '#FAF6F0',
                        },
                        ember: {
                            400: '#FBBF24',
                            500: '#D97706',
                            600: '#B45309',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .wood-surface {
            background-color: #160F0A;
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(217, 119, 6, 0.16) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 100%, rgba(180, 83, 9, 0.14) 0%, transparent 50%),
                repeating-linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.012) 0px,
                    rgba(255, 255, 255, 0.012) 1px,
                    transparent 1px,
                    transparent 14px
                );
        }
        .wood-card {
            background: linear-gradient(165deg, rgba(46, 31, 21, 0.92) 0%, rgba(28, 19, 13, 0.96) 100%);
            border: 1px solid rgba(217, 119, 6, 0.25);
            box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(251, 191, 36, 0.12);
        }
        .ember-glow {
            box-shadow: 0 0 30px rgba(217, 119, 6, 0.35);
        }
    </style>
</head>
<body class="wood-surface text-wood-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-ember-500 selection:text-white">

    <!-- Header -->
    <header class="bg-wood-950/90 backdrop-blur-md border-b border-amber-500/25">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-24 flex items-center justify-between">
            <a href="index.html" class="flex items-center py-2">
                <img src="LogoPGC-Transparent-White.png" alt="Peter's Guitar Class Logo" class="h-14 sm:h-16 w-auto object-contain">
            </a>
            <a href="index.html" class="text-sm font-medium text-amber-300 hover:text-amber-200 transition">
                &larr; Back to Home
            </a>
        </div>
    </header>

    <!-- Main Booking Section -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 py-12 w-full flex-1">
        <div class="wood-card rounded-3xl p-6 sm:p-10 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <span class="text-xs font-bold uppercase tracking-widest text-amber-400">Step 1 of 1</span>
                <h1 class="font-serif text-3xl sm:text-4xl font-bold text-white">Book Your £9 Strategy Session</h1>
                <p class="text-wood-200 text-sm sm:text-base max-w-xl mx-auto">
                    Select a convenient date and time below to lock in your session with Peter.
                </p>
            </div>

            <!-- Cal inline embed code -->
            <div class="bg-wood-950 rounded-2xl p-4 border border-amber-500/20 overflow-hidden" style="min-height: 650px;">
                <div style="width:100%;height:100%;overflow:scroll" id="my-cal-inline-peterguitarclass"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-amber-500/15 py-6 text-center text-xs text-wood-200/50">
        <p>&copy; 2026 Peter's Guitar Class. Macclesfield, Cheshire, UK.</p>
    </footer>

    <!-- Cal Embed Script -->
    <script type="text/javascript">
      (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if(typeof namespace === "string"){cal.ns[namespace] = cal.ns[namespace] || api;p(cal.ns[namespace], ar);p(cal, ["initNamespace", namespace]);} else p(cal, ar); return;} p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");
      Cal("init", "peterguitarclass", {origin:"https://app.cal.com"});
      Cal.config = Cal.config || {};
      Cal.config.forwardQueryParams = true;

      Cal.ns.peterguitarclass("inline", {
        elementOrSelector:"#my-cal-inline-peterguitarclass",
        config: {"layout":"month_view","useSlotsViewOnSmallScreen":"true"},
        calLink: "peter-dfligy/peterguitarclass",
      });

      Cal.ns.peterguitarclass("ui", {"hideEventTypeDetails":false,"layout":"month_view"});
      
      Cal.ns.peterguitarclass("on", {
        action: "bookingSuccessful",
        callback: (e) => {
          console.log("Strategy Session booking completed:", e.detail);
          if (typeof gtag === 'function') {
            gtag('event', 'purchase', {
              transaction_id: e.detail?.data?.uid || Date.now().toString(),
              value: 9.00,
              currency: 'GBP',
              items: [{ item_name: 'Strategy Session' }]
            });
          }
          if (typeof fbq === 'function') {
            fbq('track', 'Purchase', {
              value: 9.00,
              currency: 'GBP',
              content_name: 'Strategy Session'
            });
          }
          setTimeout(() => {
            window.location.href = 'thank-you.html';
          }, 1200);
        }
      });
    </script>
</body>
</html>
